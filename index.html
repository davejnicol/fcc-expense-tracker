<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Expense Tracker</title>
		<link rel="stylesheet" href="css/style.css" />
	</head>
	<body>
		<header>
			<div class="branding">
				<div class="logo">
					<?xml version="1.0" encoding="utf-8"?>
					<svg height="40px" width="40px" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" xml:space="preserve">
						<g>
							<g>
								<path
									d="M474.184,64.788c0-7.898-5.425-14.761-13.11-16.586L259.93,0.461c-2.588-0.615-5.284-0.615-7.873,0L50.912,48.202 c-7.684,1.824-13.11,8.688-13.11,16.586c0,122.324-7.005,180.57,32.367,262.34c39.72,82.493,92.644,115.305,175.193,181.153 c6.217,4.959,15.04,4.96,21.26,0c85.269-68.019,136.078-99.917,175.193-181.153C481.276,245.175,474.184,186.6,474.184,64.788z M245.033,223.045h21.935c62.457,0,67.715,92.113,6.079,99.621v26.073c0,8.75-6.411,16.427-15.107,17.387 c-10.282,1.134-18.985-6.885-18.985-16.939v-26.137h-26.826c-8.75,0-16.427-6.41-17.387-15.107 c-1.134-10.282,6.885-18.985,16.939-18.985h55.287c21.025,0,21.026-31.819,0-31.819h-21.935c-62.457,0-67.715-92.113-6.079-99.621 v-26.073c0-8.75,6.411-16.427,15.107-17.387c10.282-1.134,18.985,6.885,18.985,16.939v26.137h26.826 c8.75,0,16.427,6.41,17.387,15.107c1.134,10.282-6.885,18.985-16.939,18.985h-55.287 C224.007,191.226,224.007,223.045,245.033,223.045z"
								/>
							</g>
						</g>
					</svg>
					<div class="name">Ex<span>$</span>pen<span>$</span>e Tracker</div>
				</div>
			</div>
			<div class="theme-switcher">
				<button id="theme-toggle" class="theme-toggle" aria-label="Switch to dark theme">
					<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 180 180">
						<g id="toogle-sun">
							<path
								d="M153.64,116.36l26.36-26.36-26.36-26.36V26.36h-37.28L90,0l-26.36,26.36H26.36v37.28L0,90l26.36,26.36v37.28h37.28l26.36,26.36,26.36-26.36h37.28v-37.28ZM90,140c-27.61,0-50-22.39-50-50s22.39-50,50-50,50,22.39,50,50-22.39,50-50,50Z"
							/>
						</g>
						<g id="toggle-circle"><path d="M127.5,90c0,20.71-16.79,37.5-37.5,37.5s-37.5-16.79-37.5-37.5,16.79-37.5,37.5-37.5,37.5,16.79,37.5,37.5Z" /></g>
					</svg>
				</button>
			</div>
		</header>
		<main>
			<div class="container">
				<div class="balance-container" id="balance-container">
					<h1>Your Balance</h1>
					<div class="balance" id="balance">$0.00</div>

					<div class="summary-container">
						<div class="amount-container" data-type="income-total">
							<h2>Income</h2>
							<p class="income" id="income">$0.00</p>
						</div>
						<div class="amount-container" data-type="expense-total">
							<h2>Expenses</h2>
							<p class="expenses" id="expenses">$0.00</p>
						</div>
					</div>
				</div>

				<div class="main-content">
					<div class="transaction-container">
						<h3>Transactions</h3>
						<ul class="transaction-list" id="transaction-list"></ul>
					</div>
					<div class="form-container">
						<h3>Add Transaction</h3>

						<form id="transaction-form">
							<div class="form-group">
								<label for="description">Description</label>
								<input type="text" id="description" placeholder="Enter description..." required />
							</div>

							<div class="form-group">
								<label for="amount">Amount</label>
								<input type="number" id="amount" placeholder="Enter amount..." step="0.01" required />
								<small>Use negative (-) for expenses</small>
							</div>

							<button type="submit">Add Transaction</button>
						</form>
					</div>
				</div>
			</div>
		</main>
		<footer>
			&copy;
			<script>
				document.write(new Date().getFullYear());
			</script>
			Expense Tracker
		</footer>

		<script src="js/script.js"></script>
		<script src="js/theme-toggle.js"></script>
	</body>
</html>
